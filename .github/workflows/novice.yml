name: Novice

# Novice is the main line, so its checks are light and fast. Tier 1 (Linux x86_64 and aarch64, glibc) runs on every change to novice/ or to this file.
# Tier 2 (macOS, Windows, musl) builds and tests weekly and on demand, because Novice's decisions use integers only and identical results across
# platforms are expected by design; they are compared at milestones, not on every commit. baby's thirteen-row matrix is in ci.yml and runs when baby
# changes. A failure on a tier 2 row is a finding to look at, not a reason to stop work on tier 1.
on:
  push:
    branches: [main]
    paths:
      - 'novice/**'
      - 'tools/hidden_worlds*.py'
      - '.github/workflows/novice.yml'
  pull_request:
    paths:
      - 'novice/**'
      - 'tools/hidden_worlds*.py'
      - '.github/workflows/novice.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-glibc
            os: ubuntu-24.04
          - name: linux-aarch64-glibc
            os: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      # Third-party actions are pinned by commit, with the tag or branch noted beside each (as in ci.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Build and test Novice (its own workspace, no dependencies, no network)
        working-directory: novice
        run: |
          rustc -Vv
          cargo build --release --offline
          cargo test --release --offline

      # The goldens (novice/golden/README.md): the static exam, the adaptive exam and the eight sets of hidden worlds, replies and counted work, compared byte
      # for byte. A difference fails the job on the reference row (Linux x86_64 glibc) and is only reported on the other.
      - name: Goldens
        continue-on-error: ${{ matrix.name != 'linux-x86_64-glibc' }}
        run: bash novice/golden/check.sh

      # The entry exam is judged by baby's judge, which is why baby is built here too. The judge's verdict on honesty is the gate: zero wrong facts.
      - name: Entry exam, adaptive tier (honesty gate)
        run: |
          cargo build --release --offline --bin baby
          ./target/release/baby exam adapt-write "$RUNNER_TEMP/exam" --seed 1
          EXAM_NO_JOULES=1 ./target/release/baby exam adapt-drive "$RUNNER_TEMP/exam" "$PWD/novice/target/release/novice" serve | tee exam.out
          grep -q '^WRONG facts over the whole stream (must be 0): 0$' exam.out

  tier2:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2022
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    env:
      TARGET_FLAG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build and test Novice
        working-directory: novice
        run: |
          rustc -Vv
          cargo build --release --offline $TARGET_FLAG
          cargo test --release --offline $TARGET_FLAG
